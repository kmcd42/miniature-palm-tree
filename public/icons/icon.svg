  <!-- Corner brackets (terminal accents) -->
  <g stroke="#FFB453" stroke-width="6" fill="none" stroke-linecap="square" opacity="0.85">
    <path d="M 56 96 L 56 56 L 96 56"/>
    <path d="M 416 56 L 456 56 L 456 96"/>
    <path d="M 56 416 L 56 456 L 96 456"/>
    <path d="M 456 416 L 456 456 L 416 456"/>
  </g>

  <!-- Compounding bars + trend line -->
  <g filter="url(#glow)">
    <rect x="160" y="330" width="44" height="80"  fill="url(#bar)" rx="2"/>
    <rect x="234" y="290" width="44" height="120" fill="url(#bar)" rx="2"/>
    <rect x="308" y="230" width="44" height="180" fill="url(#bar)" rx="2"/>

    <!-- Trend line piercing upward -->
