      d="M 180 320 L 254 280 L 328 220 L 408 132"
      stroke="#FFB453"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Arrow head -->
    <path d="M 408 132 L 370 138 L 388 162 Z" fill="#FFB453"/>
  </g>

  <!-- Centered mono callout -->
