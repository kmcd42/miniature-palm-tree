<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#0A0F0C"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect y="2" width="4" height="2" fill="#000000" fill-opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Pixel-art dollar sign in phosphor green (14×20 grid, 24px cells) -->
  <g fill="#5DE88E" filter="url(#glow)">
    <!-- Row 0  (y=16):  cols 6-7 (top of vertical bar) -->
    <rect x="232" y="16" width="48" height="24"/>
    <!-- Row 1  (y=40):  cols 6-7 -->
    <rect x="232" y="40" width="48" height="24"/>
    <!-- Row 2  (y=64):  cols 2-11 (top of S) -->
    <rect x="136" y="64" width="240" height="24"/>
    <!-- Row 3  (y=88):  cols 1-4, 6-7, 9-12 -->
    <rect x="112" y="88" width="96" height="24"/>
    <rect x="232" y="88" width="48" height="24"/>
    <rect x="304" y="88" width="96" height="24"/>
    <!-- Row 4  (y=112): cols 1-2, 6-7, 11-12 -->
    <rect x="112" y="112" width="48" height="24"/>
    <rect x="232" y="112" width="48" height="24"/>
    <rect x="352" y="112" width="48" height="24"/>
    <!-- Row 5  (y=136): cols 1-2, 6-7 -->
    <rect x="112" y="136" width="48" height="24"/>
    <rect x="232" y="136" width="48" height="24"/>
    <!-- Row 6  (y=160): cols 1-2, 6-7 -->
    <rect x="112" y="160" width="48" height="24"/>
    <rect x="232" y="160" width="48" height="24"/>
    <!-- Row 7  (y=184): cols 2-4, 6-7 -->
    <rect x="136" y="184" width="72" height="24"/>
    <rect x="232" y="184" width="48" height="24"/>
    <!-- Row 8  (y=208): cols 3-7 (diagonal swoosh start) -->
    <rect x="160" y="208" width="120" height="24"/>
    <!-- Row 9  (y=232): cols 4-8 -->
    <rect x="184" y="232" width="120" height="24"/>
    <!-- Row 10 (y=256): cols 5-9 -->
    <rect x="208" y="256" width="120" height="24"/>
    <!-- Row 11 (y=280): cols 6-10 -->
    <rect x="232" y="280" width="120" height="24"/>
    <!-- Row 12 (y=304): cols 6-7, 10-12 -->
    <rect x="232" y="304" width="48" height="24"/>
    <rect x="328" y="304" width="72" height="24"/>
    <!-- Row 13 (y=328): cols 6-7, 11-12 -->
    <rect x="232" y="328" width="48" height="24"/>
    <rect x="352" y="328" width="48" height="24"/>
    <!-- Row 14 (y=352): cols 6-7, 11-12 -->
    <rect x="232" y="352" width="48" height="24"/>
    <rect x="352" y="352" width="48" height="24"/>
    <!-- Row 15 (y=376): cols 1-2, 6-7, 11-12 -->
    <rect x="112" y="376" width="48" height="24"/>
    <rect x="232" y="376" width="48" height="24"/>
    <rect x="352" y="376" width="48" height="24"/>
    <!-- Row 16 (y=400): cols 1-4, 6-7, 9-12 -->
    <rect x="112" y="400" width="96" height="24"/>
    <rect x="232" y="400" width="48" height="24"/>
    <rect x="304" y="400" width="96" height="24"/>
    <!-- Row 17 (y=424): cols 2-11 (bottom of S) -->
    <rect x="136" y="424" width="240" height="24"/>
    <!-- Row 18 (y=448): cols 6-7 -->
    <rect x="232" y="448" width="48" height="24"/>
    <!-- Row 19 (y=472): cols 6-7 (bottom of vertical bar) -->
    <rect x="232" y="472" width="48" height="24"/>
  </g>

  <!-- CRT scanline overlay -->
  <rect width="512" height="512" rx="112" fill="url(#scan)"/>
</svg>
